<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Post</title>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --border: #e3e2dc;
    --text: #1d1d1b;
    --muted: #6d6c66;
    --accent: #2f5bea;
    --accent-text: #ffffff;
    --ok: #1f8a4c;
    --warn: #b7791f;
    --err: #c53030;
    --chip-on: #eef2ff;
    --thumb-bg: #ecebe6;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1e1e1c;
      --border: #33332f;
      --text: #ecebe6;
      --muted: #9a9991;
      --accent: #6d8cff;
      --accent-text: #0d0d0c;
      --ok: #4ccf86;
      --warn: #e5b04a;
      --err: #ff7a7a;
      --chip-on: #232a45;
      --thumb-bg: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .composer { transition: border-color 0.15s, box-shadow 0.15s; }
  .composer.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px var(--chip-on); }
  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: none;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 16px;
  }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }
  .attach {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .attach:hover { border-color: var(--accent); }
  .toolbar .hint { margin: 0; }
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .media:empty { display: none; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--thumb-bg); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 8px; text-align: center; font-size: 11px; color: var(--muted); overflow-wrap: anywhere;
  }
  .thumb .placeholder strong { font-size: 12px; letter-spacing: 0.04em; }
  .thumb.loading { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .thumb .remove {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; padding: 0;
    border-radius: 50%; border: none;
    background: rgba(0, 0, 0, 0.65); color: #fff;
    font-size: 15px; line-height: 24px; cursor: pointer;
  }
  .thumb .badge {
    position: absolute; left: 4px; bottom: 4px;
    background: rgba(0, 0, 0, 0.65); color: #fff;
    font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 5px;
  }
  .thumb .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, 0.3); }
  .thumb .progress span { display: block; height: 100%; background: var(--accent); }
  .thumb.error::after {
    content: attr(data-error);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-size: 11px; color: #fff; background: rgba(160, 30, 30, 0.85);
  }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .platforms { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .chip {
    display: block;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
  }
  .chip .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip input { accent-color: var(--accent); margin: 0 8px 0 0; }
  .chip .name { display: flex; align-items: center; font-weight: 500; }
  .logo {
    flex: none; width: 18px; height: 18px; margin-right: 8px;
    background-color: var(--brand, var(--text));
    -webkit-mask: var(--icon) center / contain no-repeat;
    mask: var(--icon) center / contain no-repeat;
  }
  .chip.on { background: var(--chip-on); border-color: var(--accent); }
  .chip.disabled { opacity: 0.5; cursor: not-allowed; }
  .chip .problems { margin: 6px 0 0 24px; font-size: 12px; color: var(--muted); }
  .chip .problems:empty { display: none; }
  .chip.on .problems { color: var(--err); }
  .chip .notes { margin: 4px 0 0 24px; font-size: 12px; color: var(--muted); }
  .chip .notes:empty { display: none; }
  .platform-section { padding: 16px 0; border-top: 1px solid var(--border); }
  .platform-section:first-child { border-top: none; padding-top: 0; }
  .platform-section .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
  .platform-section .row > span { display: flex; align-items: center; }
  .platform-section textarea {
    min-height: 72px; font-size: 15px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .platform-section textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .platform-section details { margin-top: 12px; }
  .platform-section summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; }
  .platform-section .info { font-size: 13px; margin: 12px 0 0; }
  .platform-section .field textarea { min-height: 56px; }
  .platform-section > .field > textarea { min-height: 96px; }
  .image-field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .image-field img { width: 64px; height: 40px; object-fit: cover; border-radius: 4px; background: var(--thumb-bg); }
  button.link { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
  .platform-section .row button.reset { margin-right: 12px; }
  .count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .count.near { color: var(--warn); }
  .count.over { color: var(--err); font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field.wide, .field.check { grid-column: 1 / -1; }
  .field[hidden] { display: none; }
  .field input:not([type="checkbox"]), .field select, .field textarea {
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; min-width: 0; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field .field-hint { font-size: 12px; }
  .field.check { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; }
  .field.check input { accent-color: var(--accent); margin: 0; }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .primary {
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 10px;
    padding: 11px 20px; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  .primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 14px; }
  .status.err { color: var(--err); }
  .results { list-style: none; margin: 0; padding: 0; }
  .results li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .results li:first-child { border-top: none; }
  .results .icon { width: 18px; flex: none; font-weight: 700; }
  .results .ok .icon { color: var(--ok); }
  .results .fail .icon { color: var(--err); }
  .results .detail { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .results .warning { color: var(--warn); font-size: 13px; overflow-wrap: anywhere; }
  .results a { color: var(--accent); }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
<main>
  <h1>Social Post</h1>
  <p class="sub">Write it once, then post it everywhere.</p>

  <div class="card composer" id="composer">
    <textarea id="text" placeholder="What do you want to share?" autofocus></textarea>
    <div class="media" id="media"></div>
    <div class="toolbar">
      <button class="attach" id="attach" type="button">＋ Photo or video</button>
      <input type="file" id="file" multiple hidden accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime">
      <p class="hint">or drag and drop, or paste an image</p>
    </div>
  </div>

  <div class="card">
    <p class="label">Post to</p>
    <div class="platforms" id="platforms"></div>
    <p class="hint" id="hint" hidden></p>
  </div>

  <div class="card" id="platform-settings" hidden>
    <p class="label">Customize per platform</p>
    <div id="platform-sections"></div>
    <p class="hint">Each box follows the main post until you edit it. What's in a box is exactly what that platform gets.</p>
  </div>

  <div class="actions">
    <span class="status" id="status"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to post</span>
    <button class="primary" id="post" disabled>Post</button>
  </div>

  <div class="card" id="results-card" hidden style="margin-top:16px">
    <p class="label">Results</p>
    <ul class="results" id="results"></ul>
  </div>
</main>

<script type="module">
  import { countFor, problemsFor, adjustmentsFor, resolveTitle, effectiveText, formatDuration, splitThread } from '/rules.js';

  const STORAGE_KEY = 'social-post:selected';
  const SETTINGS_KEY = 'social-post:settings';
  const SHORTS_MAX_SECONDS = 180;
  const THUMB_SIZE = 240;
  const CONVERT_TO_JPEG = new Set(['image/png', 'image/webp']);
  const MAX_IMAGE_SIDE = 4096;
  // Brand colours for the logos; X and Threads are black, so they follow the text colour instead.
  const BRAND_COLORS = {
    youtube: '#FF0000', instagram: '#E4405F', linkedin: '#0A66C2', discord: '#5865F2',
    facebook: '#0866FF', bluesky: '#0285FF', mastodon: '#6364FF', telegram: '#26A5E4',
  };
  const ACCEPTED = new Set(['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'video/mp4', 'video/quicktime']);
  const $ = (id) => document.getElementById(id);
  const textEl = $('text'), platformsEl = $('platforms'), postBtn = $('post'), statusEl = $('status'), mediaEl = $('media');

  let platforms = [];
  let selected = new Set(load());
  let items = []; // { key, file, preview, status: 'uploading' | 'done' | 'error', progress, id, error, xhr, meta }
  let posting = false;
  // Per-platform text for boxes the user has edited. Boxes not in here mirror the main post.
  let overrides = {};
  let sectionsFor = '';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...selected])); } catch {}
  }

  // ---- Per-platform fields ----
  // Each platform's section in "Customize per platform" is built from this list. `sticky` values are
  // remembered between posts; `when` hides fields that don't apply to what's attached.

  const YOUTUBE_CATEGORIES = [
    ['1', 'Film & Animation'], ['2', 'Autos & Vehicles'], ['10', 'Music'], ['15', 'Pets & Animals'], ['17', 'Sports'],
    ['19', 'Travel & Events'], ['20', 'Gaming'], ['22', 'People & Blogs'], ['23', 'Comedy'], ['24', 'Entertainment'],
    ['25', 'News & Politics'], ['26', 'Howto & Style'], ['27', 'Education'], ['28', 'Science & Technology'], ['29', 'Nonprofits & Activism'],
  ];
  const LANGUAGES = [
    ['', 'Not set'], ['en', 'English'], ['hi', 'Hindi'], ['bn', 'Bengali'], ['mr', 'Marathi'], ['ta', 'Tamil'], ['te', 'Telugu'],
    ['ur', 'Urdu'], ['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['pt', 'Portuguese'], ['ar', 'Arabic'], ['ja', 'Japanese'], ['ko', 'Korean'], ['zh', 'Chinese'],
  ];
  const singleVideo = ({ media, values }) => media.length === 1 && media[0].type.startsWith('video/') && values.postAs !== 'story';
  const hasImage = ({ media }) => media.some((m) => !m.type.startsWith('video/'));

  const FIELDS = {
    youtube: {
      textLabel: 'Description',
      main: [
        { key: 'title', type: 'text', label: 'Title', wide: true, beforeText: true },
        { key: 'privacy', type: 'select', label: 'Visibility', sticky: true, initial: 'public',
          choices: [['public', 'Public'], ['unlisted', 'Unlisted'], ['private', 'Private']] },
        { key: 'publishAt', type: 'datetime-local', label: 'Schedule (optional)' },
        { key: 'category', type: 'select', label: 'Category', initial: '', choices: [['', 'YouTube default (People & Blogs)'], ...YOUTUBE_CATEGORIES] },
        { key: 'tags', type: 'text', label: 'Tags', placeholder: 'Comma-separated, e.g. lyric video, hindi song' },
        { key: 'thumbnail', type: 'image', label: 'Custom thumbnail', wide: true,
          hint: 'JPEG or PNG, ideally 1280×720, up to 2 MB. Needs a phone-verified channel.' },
        { key: 'madeForKids', type: 'check', label: 'Made for kids', sticky: true },
        { key: 'synthetic', type: 'check', label: 'Altered or synthetic content (realistic AI-generated or edited footage)' },
      ],
      more: [
        { key: 'recordingDate', type: 'date', label: 'Recording date' },
        { key: 'language', type: 'select', label: 'Title and description language', sticky: true, initial: 'en', choices: LANGUAGES },
        { key: 'audioLanguage', type: 'select', label: 'Audio language', sticky: true, initial: '', choices: LANGUAGES },
      ],
      info: 'Until your Google API project passes YouTube\'s audit, uploads stay private whatever you choose here (see README).',
    },
    instagram: {
      textLabel: 'Caption',
      main: [
        { key: 'postAs', type: 'select', label: 'Post as', initial: 'feed', choices: [['feed', 'Post or Reel'], ['story', 'Story']] },
        { key: 'shareToFeed', type: 'check', label: 'Also share to Feed (your profile grid and followers\' home feeds)', sticky: true, initial: true, when: singleVideo },
        { key: 'coverSeconds', type: 'number', label: 'Cover frame (seconds into the video)', placeholder: '0', when: singleVideo },
        { key: 'cover', type: 'image', label: 'Or upload a cover image', hint: 'Replaces the frame above.', when: singleVideo },
        { key: 'altText', type: 'text', label: 'Alt text (images)', wide: true, placeholder: 'Describe the image for people using screen readers', when: hasImage },
        { key: 'aiGenerated', type: 'check', label: 'Label as AI-generated' },
      ],
      more: [
        { key: 'audioName', type: 'text', label: 'Audio name (Reels)', placeholder: 'Original audio', when: singleVideo },
        { key: 'trial', type: 'select', label: 'Trial reel', initial: 'off', when: singleVideo, choices: [
          ['off', 'Off'], ['manual', 'Show to non-followers first; I\'ll share it later'], ['auto', 'Show to non-followers first; share it if it does well']] },
      ],
      info: '@mentions in the caption link to those accounts and notify them. Music from Instagram\'s library, filters and stickers can\'t be added through the API.',
    },
    x: {
      main: [
        { key: 'thread', type: 'check', label: 'Split long posts into a numbered thread', sticky: true, initial: true },
        { key: 'altText', type: 'text', label: 'Alt text (images)', placeholder: 'Describe the image', when: hasImage },
        { key: 'madeWithAi', type: 'check', label: 'Label as made with AI' },
      ],
    },
  };
  const fieldsOf = (id) => [...(FIELDS[id]?.main ?? []), ...(FIELDS[id]?.more ?? [])];

  let settings = {};
  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch {}
    for (const id of Object.keys(FIELDS)) {
      settings[id] = {};
      for (const f of fieldsOf(id)) {
        settings[id][f.key] = f.sticky && saved[id]?.[f.key] !== undefined ? saved[id][f.key] : f.initial ?? (f.type === 'check' ? false : '');
      }
    }
  }
  function saveSettings() {
    const sticky = {};
    for (const id of Object.keys(FIELDS)) {
      sticky[id] = Object.fromEntries(fieldsOf(id).filter((f) => f.sticky).map((f) => [f.key, settings[id][f.key]]));
    }
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(sticky)); } catch {}
  }
  // After a successful post, everything that isn't sticky goes back to its starting value.
  function resetSettings() {
    for (const id of Object.keys(FIELDS)) {
      for (const f of fieldsOf(id)) {
        if (f.sticky) continue;
        const value = settings[id][f.key];
        if (f.type === 'image' && value?.id) fetch(`/api/media/${value.id}`, { method: 'DELETE' }).catch(() => {});
        settings[id][f.key] = f.initial ?? (f.type === 'check' ? false : '');
      }
    }
  }
  loadSettings();

  // What's sent (forSend: image fields as upload ids) or checked (image fields as { type, size }).
  function platformOptions({ forSend = false } = {}) {
    const options = {};
    const media = mediaMeta();
    for (const p of platforms) {
      const own = { ...(settings[p.id] ?? {}) };
      for (const f of fieldsOf(p.id)) {
        // Fields hidden for what's attached (e.g. a Reel cover with no video) aren't sent or checked.
        if (f.when && !f.when({ media, values: own })) { delete own[f.key]; continue; }
        if (f.type === 'image') own[f.key] = own[f.key]?.id ? (forSend ? own[f.key].id : own[f.key]) : undefined;
      }
      // Only platforms whose box was edited get their own text; the rest follow the main post.
      if (p.id in overrides) own.text = overrides[p.id];
      options[p.id] = own;
    }
    return options;
  }
  // What an unedited platform box shows: the main post, or on YouTube everything after the title line.
  const mirrored = (id) => effectiveText(textEl.value, { title: settings[id]?.title }, id);
  const fieldUploading = () => Object.values(settings).some((s) => Object.values(s).some((v) => v?.uploading));

  // Tells the user whether YouTube will treat the attached video as a Short.
  function renderShortsHint() {
    const el = $('yt-shorts');
    if (!el) return;
    const video = items.find((i) => i.file.type.startsWith('video/'));
    if (!video?.meta) { el.hidden = true; return; }
    const { width, height, duration } = video.meta;
    const shape = height > width ? 'vertical' : height === width ? 'square' : 'horizontal';
    const isShort = height >= width && duration <= SHORTS_MAX_SECONDS;
    el.hidden = false;
    el.textContent = isShort
      ? `This video is ${shape} and ${formatDuration(duration)} long, so it will be published as a Short.`
      : `This video is ${shape} and ${formatDuration(duration)} long, so it will be a regular video. Shorts must be vertical or square and up to 3:00.`;
  }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // ---- Media ----

  // Instagram only takes JPEG and every platform accepts it, so PNG and WebP are converted on the way in.
  // Transparent areas become white, and very large images are scaled to 4096px on the longest side.
  async function toJpeg(file) {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(bitmap.width, bitmap.height));
    const canvas = Object.assign(document.createElement('canvas'), {
      width: Math.round(bitmap.width * scale),
      height: Math.round(bitmap.height * scale),
    });
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    const blob = await new Promise((resolve, reject) =>
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Could not convert image'))), 'image/jpeg', 0.92));
    const name = (file.name || 'pasted-image').replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], name, { type: 'image/jpeg' });
  }

  async function addFiles(files) {
    for (let file of files) {
      if (!ACCEPTED.has(file.type)) {
        setStatus(`${file.name || 'That file'} isn't supported. Use JPEG, PNG, GIF, WebP, MP4 or MOV.`, true);
        continue;
      }
      if (CONVERT_TO_JPEG.has(file.type)) {
        try { file = await toJpeg(file); } catch { /* keep the original; platform checks will flag it */ }
      }
      const item = { key: crypto.randomUUID(), file, preview: URL.createObjectURL(file), status: 'uploading', progress: 0 };
      items.push(item);
      upload(item);
      makeThumbnail(item);
      renderMedia();
      update();
    }
  }

  function upload(item) {
    const xhr = new XMLHttpRequest();
    item.xhr = xhr;
    xhr.open('POST', '/api/media');
    xhr.setRequestHeader('Content-Type', item.file.type);
    xhr.setRequestHeader('X-Filename', encodeURIComponent(item.file.name || 'pasted-image'));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      item.progress = e.loaded / e.total;
      const bar = mediaEl.querySelector(`[data-key="${item.key}"] .progress span`);
      if (bar) bar.style.width = `${item.progress * 100}%`;
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 201) Object.assign(item, { status: 'done', id: data.id });
      else Object.assign(item, { status: 'error', error: data.error || `Upload failed (${xhr.status})` });
      renderMedia();
      update();
    };
    xhr.onerror = () => {
      Object.assign(item, { status: 'error', error: 'Upload failed' });
      renderMedia();
      update();
    };
    xhr.send(item.file);
  }

  function once(target, event) {
    return new Promise((resolve, reject) => {
      target.addEventListener(event, resolve, { once: true });
      target.addEventListener('error', () => reject(new Error('Could not read the file')), { once: true });
    });
  }

  // Renders a small JPEG preview. Browsers often leave a <video> blank until it plays, so for
  // videos we seek a little way in and capture that frame; images are downscaled the same way.
  async function makeThumbnail(item) {
    const draw = (source, width, height) => {
      const scale = Math.min(1, THUMB_SIZE / Math.min(width, height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    };
    try {
      if (item.file.type.startsWith('video/')) {
        const video = Object.assign(document.createElement('video'), { muted: true, playsInline: true, preload: 'auto', src: item.preview });
        await once(video, 'loadedmetadata');
        // Width 0 means the browser can't decode this codec (e.g. some iPhone HEVC .mov files).
        if (!video.videoWidth) throw new Error('Unsupported codec');
        item.meta = { width: video.videoWidth, height: video.videoHeight, duration: video.duration };
        video.currentTime = Math.min(1, video.duration / 2);
        await once(video, 'seeked');
        item.thumb = draw(video, video.videoWidth, video.videoHeight);
        video.removeAttribute('src');
        video.load();
      } else {
        const bitmap = await createImageBitmap(item.file);
        item.thumb = draw(bitmap, bitmap.width, bitmap.height);
        bitmap.close();
      }
    } catch {
      item.thumbFailed = true;
    }
    renderMedia();
    update();
  }

  function removeItem(item) {
    item.xhr?.abort();
    if (item.id) fetch(`/api/media/${item.id}`, { method: 'DELETE' }).catch(() => {});
    URL.revokeObjectURL(item.preview);
    items = items.filter((i) => i !== item);
    renderMedia();
    update();
  }

  function clearMedia() {
    for (const item of [...items]) removeItem(item);
  }

  function renderMedia() {
    mediaEl.replaceChildren(...items.map((item) => {
      const isVideo = item.file.type.startsWith('video/');
      const preview = item.thumb
        ? el('img', { src: item.thumb, alt: item.file.name })
        : item.thumbFailed
          ? el('div', { className: 'placeholder' }, el('strong', { textContent: isVideo ? 'VIDEO' : 'IMAGE' }), item.file.name || 'pasted image')
          : el('div', { className: 'placeholder' });
      const remove = el('button', { className: 'remove', type: 'button', textContent: '×', title: 'Remove', ariaLabel: `Remove ${item.file.name}` });
      remove.addEventListener('click', () => removeItem(item));
      const pending = !item.thumb && !item.thumbFailed;
      const thumb = el('div', {
        className: 'thumb' + (item.status === 'error' ? ' error' : '') + (pending ? ' loading' : ''),
        title: item.file.name,
      }, preview, remove);
      thumb.dataset.key = item.key;
      if (item.status === 'error') thumb.dataset.error = item.error;
      const badge = isVideo ? (item.meta ? `▶ ${formatDuration(item.meta.duration)}` : 'VIDEO') : item.file.type === 'image/gif' ? 'GIF' : '';
      if (badge && !item.thumbFailed) thumb.append(el('span', { className: 'badge', textContent: badge }));
      if (item.status === 'uploading') {
        const bar = el('span');
        bar.style.width = `${item.progress * 100}%`;
        thumb.append(el('div', { className: 'progress' }, bar));
      }
      return thumb;
    }));
  }

  // ---- Platforms ----

  function logo(id) {
    const span = el('span', { className: 'logo', ariaHidden: 'true' });
    span.style.setProperty('--icon', `url(/icons/${id}.svg)`);
    if (BRAND_COLORS[id]) span.style.setProperty('--brand', BRAND_COLORS[id]);
    return span;
  }

  function renderPlatforms() {
    platformsEl.replaceChildren(...platforms.map((p) => {
      const input = el('input', { type: 'checkbox', checked: selected.has(p.id), disabled: !p.configured });
      input.addEventListener('change', () => {
        input.checked ? selected.add(p.id) : selected.delete(p.id);
        save();
        update();
      });
      const chip = el('label', {
        className: 'chip',
        title: p.configured ? '' : `Not configured. Add ${p.envVars.join(', ')} to .env`,
      },
        el('div', { className: 'row' },
          el('span', { className: 'name' }, input, logo(p.id), p.name),
          el('span', { className: 'count' }),
        ),
        el('div', { className: 'problems' }),
        el('div', { className: 'notes' }),
      );
      chip.dataset.id = p.id;
      return chip;
    }));

    const missing = platforms.filter((p) => !p.configured);
    $('hint').hidden = missing.length === 0;
    $('hint').textContent = missing.length === platforms.length
      ? 'No platforms are set up yet. Copy .env.example to .env, add your credentials, and restart the server.'
      : `Greyed out platforms aren't set up yet. Hover over one to see which .env values it needs.`;
  }

  const mediaMeta = () => items.map((i) => ({
    name: i.file.name || 'pasted image', type: i.file.type, size: i.file.size, duration: i.meta?.duration,
  }));
  const activeTargets = () => platforms.filter((p) => p.configured && selected.has(p.id));

  // "312 / 280" normally; "312 · 2 posts" when X will split it into a thread.
  function counter(p, text, options = {}) {
    const n = countFor(p.id, text);
    const parts = p.threads && options.thread && n > p.limit ? splitThread(p.id, text, p.limit).length : 1;
    if (parts > 1) return { textContent: `${n.toLocaleString()} · ${parts} posts`, className: 'count' };
    return { textContent: `${n.toLocaleString()} / ${p.limit.toLocaleString()}`, className: 'count' + (n > p.limit ? ' over' : n > p.limit * 0.9 ? ' near' : '') };
  }

  // Uploads an image picked for a field (thumbnail, cover). PNG/WebP become JPEG like other images.
  async function pickFieldImage(id, key, file) {
    const previous = settings[id][key];
    if (previous?.id) fetch(`/api/media/${previous.id}`, { method: 'DELETE' }).catch(() => {});
    if (!file.type.startsWith('image/')) { setStatus(`${file.name} isn't an image.`, true); return; }
    if (CONVERT_TO_JPEG.has(file.type)) {
      try { file = await toJpeg(file); } catch {}
    }
    const value = { uploading: true, name: file.name, type: file.type, size: file.size, preview: URL.createObjectURL(file) };
    settings[id][key] = value;
    sectionsFor = '';
    update();
    try {
      const res = await fetch('/api/media', {
        method: 'POST',
        headers: { 'Content-Type': file.type, 'X-Filename': encodeURIComponent(file.name) },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
      Object.assign(value, { uploading: false, id: data.id });
    } catch (err) {
      settings[id][key] = '';
      setStatus(err.message, true);
    }
    sectionsFor = '';
    update();
  }

  function renderField(id, f) {
    const values = settings[id];
    const set = (value) => {
      values[f.key] = value;
      if (f.sticky) saveSettings();
      update();
    };
    let control;
    if (f.type === 'check') {
      const box = el('input', { type: 'checkbox', checked: Boolean(values[f.key]) });
      box.addEventListener('change', () => set(box.checked));
      control = el('label', { className: 'field check' }, box, f.label);
    } else if (f.type === 'select') {
      const select = el('select', {}, ...f.choices.map(([value, label]) => el('option', { value, textContent: label })));
      select.value = values[f.key];
      select.addEventListener('change', () => set(select.value));
      control = el('label', { className: 'field' }, f.label, select);
    } else if (f.type === 'image') {
      const value = values[f.key];
      const input = el('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', hidden: true });
      input.addEventListener('change', () => input.files[0] && pickFieldImage(id, f.key, input.files[0]));
      const choose = el('button', { type: 'button', className: 'attach', textContent: value ? 'Replace image' : 'Choose image' });
      choose.addEventListener('click', () => input.click());
      const parts = [choose, input];
      if (value) {
        const remove = el('button', { type: 'button', className: 'link', textContent: 'Remove' });
        remove.addEventListener('click', () => {
          if (value.id) fetch(`/api/media/${value.id}`, { method: 'DELETE' }).catch(() => {});
          set('');
          sectionsFor = '';
          update();
        });
        parts.unshift(el('img', { src: value.preview || '', alt: '' }));
        parts.push(el('span', { textContent: value.uploading ? 'Uploading…' : value.name }), remove);
      }
      control = el('div', { className: 'field' }, f.label, el('div', { className: 'image-field' }, ...parts));
    } else {
      const input = f.type === 'textarea' ? el('textarea') : el('input', { type: f.type, autocomplete: 'off' });
      if (f.type === 'number') Object.assign(input, { min: 0, step: 0.1 });
      Object.assign(input, { value: values[f.key] ?? '', placeholder: f.placeholder ?? '' });
      input.addEventListener('input', () => set(input.value));
      control = el('label', { className: 'field' }, f.label, input);
    }
    if (f.wide) control.classList.add('wide');
    if (f.hint) control.append(el('span', { className: 'field-hint', textContent: f.hint }));
    control.dataset.key = f.key;
    return control;
  }

  // One section per selected platform: its own text box plus its fields. Only rebuilt when the set of
  // platforms (or an image field) changes, so typing keeps focus.
  function renderSections(targets) {
    sectionsFor = targets.map((p) => p.id).join(',');
    $('platform-sections').replaceChildren(...targets.map((p) => {
      const spec = FIELDS[p.id];
      // The box shows the main post until it's edited; then it's this platform's own text.
      const box = el('textarea', {
        value: p.id in overrides ? overrides[p.id] : mirrored(p.id),
        placeholder: 'Type in the main box above, or here for this platform only',
        className: 'platform-text',
      });
      box.dataset.id = p.id;
      box.addEventListener('input', () => { overrides[p.id] = box.value; update(); });
      const reset = el('button', { type: 'button', className: 'link reset', textContent: '↺ Use main post', title: 'Follow the main post again' });
      reset.addEventListener('click', () => {
        delete overrides[p.id];
        box.value = mirrored(p.id);
        update();
      });
      const section = el('div', { className: 'platform-section' },
        el('div', { className: 'row' }, el('span', {}, logo(p.id), p.name), el('span', {}, reset, el('span', { className: 'count' }))));
      // Fields marked beforeText (YouTube's title) go above the text box, as on the platform itself.
      const before = spec?.main.filter((f) => f.beforeText) ?? [];
      if (before.length) section.append(el('div', { className: 'fields', style: 'margin: 0 0 12px' }, ...before.map((f) => renderField(p.id, f))));
      section.append(spec?.textLabel ? el('label', { className: 'field' }, spec.textLabel, box) : box);
      if (spec) {
        section.append(el('div', { className: 'fields' }, ...spec.main.filter((f) => !f.beforeText).map((f) => renderField(p.id, f))));
        if (spec.more?.length) {
          section.append(el('details', {}, el('summary', { textContent: 'More options' }),
            el('div', { className: 'fields' }, ...spec.more.map((f) => renderField(p.id, f)))));
        }
        if (p.id === 'youtube') section.append(el('p', { className: 'info', id: 'yt-shorts', hidden: true }));
        if (spec.info) section.append(el('p', { className: 'hint', textContent: spec.info }));
      }
      section.dataset.id = p.id;
      return section;
    }));
  }

  // Hides fields that don't apply to what's attached (e.g. Reel options without a video).
  function refreshFieldVisibility(media) {
    for (const section of $('platform-sections').children) {
      const id = section.dataset.id;
      for (const f of fieldsOf(id)) {
        const node = section.querySelector(`[data-key="${f.key}"]`);
        if (node) node.hidden = f.when ? !f.when({ media, values: settings[id] }) : false;
      }
    }
  }

  function update() {
    const text = textEl.value.trim();
    const media = mediaMeta();
    const options = platformOptions();
    const targets = activeTargets();
    let blocked = false;

    $('platform-settings').hidden = targets.length === 0;
    if (sectionsFor !== targets.map((p) => p.id).join(',')) renderSections(targets);
    refreshFieldVisibility(media);
    for (const section of $('platform-sections').children) {
      const p = platforms.find((x) => x.id === section.dataset.id);
      Object.assign(section.querySelector('.count'), counter(p, effectiveText(text, options[p.id], p.id), options[p.id]));
      // Boxes that haven't been edited follow the main post as it's typed.
      const box = section.querySelector('.platform-text');
      const edited = p.id in overrides;
      if (!edited && box.value !== mirrored(p.id)) box.value = mirrored(p.id);
      section.querySelector('.reset').hidden = !edited;
    }
    const titleInput = $('platform-sections').querySelector('[data-key="title"] input');
    if (titleInput) {
      const fallback = resolveTitle(text, '');
      titleInput.placeholder = fallback ? `Defaults to: ${fallback}` : 'Defaults to the first line of your post';
    }
    renderShortsHint();

    for (const p of platforms) {
      const on = selected.has(p.id) && p.configured;
      const chip = platformsEl.querySelector(`[data-id="${p.id}"]`);
      chip.classList.toggle('on', on);
      chip.classList.toggle('disabled', !p.configured);

      const own = effectiveText(text, options[p.id], p.id);
      Object.assign(chip.querySelector('.count'), p.configured ? counter(p, own, options[p.id]) : { textContent: 'not set up', className: 'count' });

      const problems = p.configured ? problemsFor(p, text, media, options[p.id]) : [];
      // An empty composer can't be posted anyway, so don't greet the user with warnings.
      const started = own || media.length || options[p.id]?.title?.trim();
      chip.querySelector('.problems').textContent = started ? problems.join(' · ') : '';
      chip.querySelector('.notes').textContent = p.configured && on ? adjustmentsFor(p, media, options[p.id], text).join(' · ') : '';
      if (on && problems.length) blocked = true;
    }

    const uploading = items.some((i) => i.status === 'uploading') || fieldUploading();
    const failedUpload = items.some((i) => i.status === 'error');
    const anyText = text || targets.some((p) => options[p.id]?.text);
    postBtn.textContent = uploading ? 'Uploading…' : targets.length > 1 ? `Post to ${targets.length} platforms` : 'Post';
    postBtn.disabled = posting || uploading || failedUpload || blocked || targets.length === 0 || (!anyText && items.length === 0);
    postBtn.title = failedUpload ? 'Remove the files that failed to upload' : blocked ? 'Fix the issues shown in red, or deselect those platforms' : '';
  }

  // ---- Posting ----

  function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.className = 'status' + (isError ? ' err' : '');
  }

  function renderResults(results) {
    $('results-card').hidden = false;
    $('results').replaceChildren(...results.map((r) => {
      const detail = r.ok
        ? (r.url ? el('a', { href: r.url, target: '_blank', rel: 'noopener', textContent: 'View post' }) : 'Posted')
        : r.error;
      return el('li', { className: r.ok ? 'ok' : 'fail' },
        el('span', { className: 'icon', textContent: r.ok ? '✓' : '✕' }),
        el('div', {},
          el('div', { textContent: r.name }),
          el('div', { className: 'detail' }, detail),
          ...(r.warnings ?? []).map((w) => el('div', { className: 'warning', textContent: `⚠ ${w}` })),
        ),
      );
    }));
  }

  async function post() {
    if (postBtn.disabled) return;
    const targets = activeTargets();
    posting = true;
    update();
    const hasVideo = items.some((i) => i.file.type.startsWith('video/'));
    const compressing = targets.some((p) => adjustmentsFor(p, mediaMeta()).length);
    setStatus(`Posting to ${targets.map((p) => p.name).join(', ')}…`
      + (compressing ? ' Compressing the video first, which can take several minutes.' : hasVideo ? ' Videos can take a few minutes to process.' : ''));
    try {
      const res = await fetch('/api/post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: textEl.value,
          platforms: targets.map((p) => p.id),
          media: items.map((i) => ({ id: i.id, duration: i.meta?.duration })),
          options: platformOptions({ forSend: true }),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      renderResults(data.results);
      const failed = data.results.filter((r) => !r.ok).length;
      if (failed === 0) {
        setStatus(`Posted to ${data.results.length} platform${data.results.length > 1 ? 's' : ''}.`);
        textEl.value = '';
        overrides = {};
        resetSettings();
        sectionsFor = '';
        clearMedia();
      } else {
        // Keep the text and media so you can fix the problem and retry just the failed platforms.
        setStatus(`${failed} of ${data.results.length} failed. Your post was kept so you can retry.`, true);
        selected = new Set(data.results.filter((r) => !r.ok).map((r) => r.id));
        save();
        renderPlatforms();
      }
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      posting = false;
      update();
    }
  }

  // ---- Events ----

  textEl.addEventListener('input', update);
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(); }
  });
  textEl.addEventListener('paste', (e) => {
    const files = [...e.clipboardData.files];
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  postBtn.addEventListener('click', post);
  $('attach').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { addFiles([...e.target.files]); e.target.value = ''; });

  const composer = $('composer');
  let dragDepth = 0;
  composer.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; composer.classList.add('dragging'); });
  composer.addEventListener('dragover', (e) => e.preventDefault());
  composer.addEventListener('dragleave', () => { if (--dragDepth === 0) composer.classList.remove('dragging'); });
  composer.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    composer.classList.remove('dragging');
    addFiles([...e.dataTransfer.files]);
  });

  try {
    platforms = await (await fetch('/api/platforms')).json();
    renderPlatforms();
    update();
  } catch (err) {
    setStatus(`Could not load platforms: ${err.message}`, true);
  }
</script>
</body>
</html>
